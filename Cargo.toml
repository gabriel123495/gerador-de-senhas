[package]
name = "senhas"
version = "0.1.0"
edition = "2021"

[dependencies]
getrandom = { version = "0.2.10", features = ["js"] }
rand = { version = "0.8", features = ["small_rng"] }
serde_json = "1.0"
wasm-bindgen = "0.2.104"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[package.metadata.wasm-pack]
wasm-opt = false
