<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>🔐 Gerador de Senhas Fortes</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="layout">
        <div class="sidebar">
            <h2 id="options-title">⚙️ Opções</h2>
            <ul>
                <li><button class="theme-btn" id="theme-btn">🌙 Tema Escuro</button></li>
                <li><button class="toggle-btn" id="uppercase-btn">🔠 Letras Maiúsculas: ON</button></li>
                <li><button class="toggle-btn numbers" id="numbers-btn">🔢 Números: ON</button></li>
                <li><button class="toggle-btn special" id="special-btn">✨ Especiais: ON</button></li>
                <li>
                    <label id="length-label" for="length-range">Comprimento da senha: <span id="length-value">8</span></label>
                    <input type="range" id="length-range" min="1" max="100" value="8">
                </li>
                <li><button class="lang-btn" id="lang-btn">change to english 🔈</button></li>
                <li><button class="toggle-btn download" id="download-btn">📥 Baixar 10 Senhas</button></li>
            </ul>
        </div>
        <div class="main-content">
            <h1 id="main-title">🔐 Gerador de Senhas Fortes</h1>
            <button class="generate-btn" id="generate-btn">🔁 Gerar Nova Senha</button>
            <h2 id="generated-label">Senha Gerada:</h2>
            <div class="senha-card" id="senha-card"></div>
        </div>
    </div>
    <script type="module" src="script.js"></script>
</body>
</html>
